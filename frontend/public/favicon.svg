<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- Background tile with smooth rounded corners -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Outer Pin Connectors -->
  <path d="M11 4v3 M16 4v3 M21 4v3" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M11 25v3 M16 25v3 M21 25v3" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M4 11h3 M4 16h3 M4 21h3" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <path d="M25 11h3 M25 16h3 M25 21h3" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Central Chip Package -->
  <rect x="8" y="8" width="16" height="16" rx="3" fill="url(#chipGrad)" />

  <!-- Core Circuit Die -->
  <rect x="11" y="11" width="10" height="10" rx="2" fill="#1e1b4b" />
  <circle cx="16" cy="16" r="2" fill="#38bdf8" />
  <circle cx="16" cy="16" r="1" fill="#ffffff" />
</svg>
